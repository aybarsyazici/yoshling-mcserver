services:
  minecraft:
    image: itzg/minecraft-server
    container_name: yoshling-mc
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      # ── UI-owned, and that is why these three read from `.env` ──────────────
      #
      # The Minecraft settings page writes TYPE/VERSION and the memory card writes
      # MEMORY. They used to be patched into THIS file, which the deploy then threw
      # away: `deploy.sh` runs `git checkout -f -B main FETCH_HEAD`, so every deploy
      # silently reverted whatever had been applied through the dashboard (undone by
      # hand once, in f0cf692). The app now patches `/opt/yoshling/.env`, which is
      # gitignored and therefore survives the checkout, and these lines interpolate
      # from it.
      #
      # The `:-` form matters twice over. It keeps the current production values as the
      # defaults, so a box with no `.env` keys -- which is every box today -- boots
      # exactly as it did before; and `:-` (unlike `-`) also falls back when the key is
      # present but EMPTY, so a truncated `MC_MEMORY=` cannot hand the JVM a blank -Xmx.
      #
      # Per-service key names are not cosmetic: `VERSION` is the Minecraft version here
      # and the Steam branch in the sevendtd block, so one shared `VERSION` key would
      # make editing Minecraft change which build 7 Days to Die downloads.
      TYPE: "${MC_TYPE:-FABRIC}"
      # 26.1.2, not 1.21.4. These disagreed for weeks: ServerConfig.mcVersion said
      # 26.1.2, the mc-data volume holds fabric-server-mc.26.1.2-loader.0.19.3 next
      # to the 217 MB world, and only this file said 1.21.4. Fabric Loader aborts on
      # 26.1.2-dependent jars before it opens level.dat, so the symptom was never
      # world corruption -- it was a boot failure the status probe rendered as a
      # permanent "Starting...".
      VERSION: "${MC_VERSION:-26.1.2}"
      MEMORY: "${MC_MEMORY:-4G}"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      ENABLE_RCON: "true"
      RCON_PORT: 25575
    volumes:
      - mc-data:/data
    # "no", like the other two worlds. `unless-stopped` turned a failed boot into an
    # unbounded crash loop, and on a host reboot it would start Minecraft regardless
    # of which world was meant to be running -- and only one fits on the box.
    restart: "no"
    # Docker's default is 10s, which is not enough to save a 217 MB world. Minecraft
    # DOES exit on SIGTERM (verified: a stop leaves `.State.ExitCode` 0), so this is a
    # real grace period that gets used, not a timeout that gets waited out.
    #
    # This used to add "PZ only got a grace period after a save was SIGKILLed halfway".
    # That never happened -- a PZ save takes ~100-170 ms (measured 2026-09-29) and could
    # not overrun any of these timeouts; PZ's 300s is there because it ignores SIGTERM
    # entirely. See the zomboid block below.
    stop_grace_period: 120s
    # The heap is 4G and a booted, empty server measured 1.93 GiB. 6g leaves the JVM
    # its non-heap overhead plus page cache without the cgroup living at its ceiling
    # the way Project Zomboid's first limit did.
    mem_limit: 6g
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    tty: true
    stdin_open: true

  # 7 Days to Die dedicated server (LinuxGSM-based image).
  # START_MODE=1 = start the server. It shares the box with Minecraft and Project
  # Zomboid, so only one should run at a time — the web UI gracefully stops the
  # others before starting this. The ceiling is NOT hardcoded anywhere: this said
  # "the 8GB box" long after the move to a 16 GB one, and `maxGameGb()` derives it
  # from /proc/meminfo at request time. Don't substitute today's number here — that
  # is the same mistake one migration later.
  # NOTE: do not use restart:unless-stopped with START_MODE 0/2/4.
  sevendtd:
    image: vinanrra/7dtd-server
    container_name: yoshling-7dtd
    ports:
      - "26900:26900/tcp"
      - "26900:26900/udp"
      - "26901:26901/udp"
      - "26902:26902/udp"
      - "8080:8080/tcp" # web admin
      - "8081:8081/tcp" # telnet control
    environment:
      # A literal, and it must stay one. `/api/7dtd/update` flips this to "3" and
      # straight back to "1" inside one operation, using `patchServiceEnv` on THIS
      # file. Moving it to `.env` would not help: the patch rewrites whatever is on the
      # line, so the first update would replace `${SDTD_START_MODE:-1}` with a bare "1"
      # and permanently detach the line from its key -- trading a dirty file that
      # self-heals within one operation for a silent, permanent drift.
      START_MODE: "1"
      # Steam branch: "stable" (Default Public) or "latest_experimental".
      # Switching branches requires a one-time update run (START_MODE=3) so the
      # server files re-download on the new branch — see CLAUDE.md.
      # Read out of this file by /api/7dtd/update, not written by the UI, so it also
      # stays a literal.
      VERSION: "latest_experimental"
      TimeZone: "Europe/London"
      TELNET_PASSWORD: "${SDTD_TELNET_PASSWORD:-yoshlingcontrol}"
    volumes:
      - sdtd-server:/home/sdtdserver/serverfiles
      - sdtd-saves:/home/sdtdserver/.local/share/7DaysToDie
      - sdtd-backup:/home/sdtdserver/lgsm/backup
      - sdtd-log:/home/sdtdserver/log
    # Do NOT auto-start on boot; the web UI powers this on deliberately so the
    # box never tries to run both worlds at once. Once started it stays up until
    # explicitly stopped (and a manual `docker stop` survives reboots).
    restart: "no"
    # Docker's default 10s is optimistic for a 416 MiB / 59k-chunk world. The driver
    # sends `saveworld` over telnet first, but the shutdown itself still needs room.
    stop_grace_period: 120s
    # 7DTD is a Unity native server with no heap setting, so this ceiling is the only
    # thing bounding it at all -- which also means there is no configured value to
    # size it against. 10g is generous for a 6144-size world and still leaves the box
    # room, and since only one world runs at a time it does not have to share.
    mem_limit: 10g
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    tty: true
    stdin_open: true

  # Project Zomboid dedicated server. The game files are baked into the image, so
  # there's no long first-boot install like 7DTD's; Workshop mods are what gets
  # downloaded, on the first start after they're added.
  #
  # IMPORTANT: SELF_MANAGED_MODS keeps the image's entrypoint away from the
  # Mods/WorkshopItems lines in the server .ini — the web UI owns those. For the
  # same reason PASSWORD, PUBLIC and DISPLAYNAME are deliberately NOT set here:
  # the entrypoint only rewrites those keys when the env var exists, and the
  # Settings page is where they're meant to be edited.
  zomboid:
    # Upstream image plus a corrected map scanner — see pz/Dockerfile for why.
    build:
      context: ./pz
    image: yoshling/project-zomboid:latest
    container_name: yoshling-pz
    ports:
      - "16261:16261/udp" # game
      - "16262:16262/udp" # direct connections
      - "8766:8766/udp" # steam query
      - "8767:8767/udp" # steam
    environment:
      SERVERNAME: "yoshling"
      ADMINUSERNAME: "admin"
      ADMINPASSWORD: "${PZ_ADMIN_PASSWORD:-changemeplease}"
      # Must match PZ_RCON_PASSWORD below; the app controls the server over RCON.
      RCONPASSWORD: "${PZ_RCON_PASSWORD:-yoshlingcontrol}"
      SELF_MANAGED_MODS: "true"
      # -Xms. Measured on production 2026-09-30 from the container's own log:
      # `-Xms2048m -Xmx12288m`, i.e. these two lines land on the JVM verbatim. NOT
      # UI-owned, and that asymmetry has teeth — `setMemory` writes only the max, so a
      # heap chosen below this one produces `-Xmx` under a larger `-Xms` and the JVM
      # refuses to start at all. `setMemory` now reads this value and refuses first.
      MIN_MEMORY: "2048m"
      # 12 GB on the current 16 GB box. UI-owned: the Settings page computes the ceiling
      # from host RAM (total - 2.5 GB reserve) and writes `PZ_MAX_MEMORY` in `.env`, then
      # recreates the container. Don't hand-edit -- change it in the UI. The default here
      # is the production value, so a box with no `.env` key boots unchanged; see the
      # long note in the minecraft block for why it is `.env` and not this file.
      MAX_MEMORY: "${PZ_MAX_MEMORY:-12288m}"
      PORT: "16261"
      UDPPORT: "16262"
      MODFOLDERS: "workshop,steam,mods"
      # Maps to keep out of the generated `Map=`; read by pz/search_folder.sh.
      # SZ_Checkpoint6 is retired on 42.20 (its content moved into
      # SZ_Riverside_Checkpoint_2) but still ships inside Secretz42, and the two
      # claim the same four cells.
      MAP_EXCLUDE: "SZ_Checkpoint6"
      TZ: "Europe/London"
    volumes:
      - pz-data:/home/steam/Zomboid
      - pz-workshop:/home/steam/pz-dedicated/steamapps/workshop
    # ## This is a FALLBACK budget, not headroom for a slow save.
    #
    # This comment used to claim "the entrypoint traps SIGTERM, writes `quit` to the
    # server console and waits for the world to be saved […] 120s turned out to be too
    # short as well: with a player connected and mods loaded, a save overran it and
    # docker escalated to SIGKILL (exit 137)."
    #
    # **None of that is true**, and because it read as a solved-but-slow shutdown, three
    # separate audits saw "PZ stops take five minutes", believed the question was already
    # answered, and moved on. Measured on production 2026-09-29:
    #
    #   - `grep -c trap /server/scripts/entry.sh` -> 0, and `grep -rn trap
    #     /server/scripts/` is empty. There is no trap, and never was.
    #   - `entry.sh` runs as PID 1 and starts the game via `su - steam -c`, so the JVM is
    #     a grandchild in its own session and process group.
    #   - `grep SigCgt /proc/1/status` -> 0000000000010002 = SIGINT(2) + SIGCHLD(17).
    #     SIGTERM(15) would be bit 14 (0x4000) and is absent, and the kernel DISCARDS
    #     uncaught signals aimed at a namespace's PID 1. So `docker stop`'s SIGTERM is
    #     not merely unforwarded, it is thrown away -- the process could never have
    #     exited on it at any timeout.
    #   - A save is ~100-170 ms (ten consecutive RCON `save` calls answered in 100.7-101.1
    #     ms; the game's own log reported 102.6-170.9 ms for the saves), so nothing was
    #     ever "SIGKILLed mid-save" -- it is three orders of magnitude inside 120s.
    #     Raising 120s -> 300s only bought a longer wait before the identical SIGKILL:
    #     `journalctl -u docker` shows 14 "failed to exit within 5m0s of signal 15" in the
    #     three days before this was written, and every one was this service (it is the
    #     only one with a 300s StopTimeout, and all 14 lines say 5m0s).
    #
    # What actually stops it is asking the game: RCON `quit` ("* quit : Save and quit the
    # server"). `zomboidDriver.stop()` in src/lib/game-manager.ts does that first.
    # Verified against production 2026-09-29 with 0 players: the container was `exited`
    # 9.0s after the quit, with exit code 0 instead of 137, and journalctl gained no new
    # "failed to exit" line.
    #
    # KEEP 300s, and keep it in step with PZ_STOP_TIMEOUT in game-manager.ts. It is the
    # budget for a server that has stopped answering RCON at all (the 2026-09-22 game-loop
    # wedge), which is exactly when `quit` cannot land. Lowering it without a mechanism
    # that makes the process genuinely exit just SIGKILLs a wedged world sooner.
    # Do NOT add `init: true` here either -- tini signals its direct child, and `su`
    # re-sessions the JVM out of reach, so it would kill entry.sh and leave the JVM to be
    # SIGKILLed as an orphan with no shutdown at all. Strictly worse.
    stop_grace_period: 300s
    # Same as 7DTD: never auto-start, the web UI powers it on deliberately so the
    # box never tries to run two worlds at once.
    restart: "no"
    # 14g for a 12288m heap. 13g was too tight and measurement showed why: with the
    # server booted and empty, `anon` (unreclaimable) was only 1.1 GiB while `file`
    # (page cache from reading mods and map cells) was 11.6 GiB -- so the cgroup sat
    # at 98% of its limit and had already reclaimed 601 times. Cache pressure is
    # harmless, but -Xmx12288m means the heap may grow to 12 GiB of *anon*, and at
    # that point a 13g ceiling is an OOM kill mid-session. A JVM with a 12 GiB heap
    # needs roughly 1-2 GiB more for metaspace, code cache, thread stacks and the
    # native model/audio libraries.
    #
    # 14g is also the practical maximum: 15.6 GiB box, minus ~1 GiB for the
    # dashboard and the OS. If Project Zomboid ever needs more than this, the heap
    # has to come down rather than the ceiling going up.
    #
    # These are per-world CEILINGS, not reservations, and they deliberately sum to more
    # than the box (6 + 10 + 14 + 3 = 33g on a 15.6 GiB host). That is sound because only
    # one world runs at a time; it is the one-at-a-time invariant, not arithmetic on these
    # numbers, that keeps the box solvent. So do not "fix" the overcommit by lowering this
    # one -- 13g was already tried and measured, and the paragraph above is why it failed.
    mem_limit: 14g
    # PZ is the reason this exists: its container log reached 123 MB of the box's
    # 122 MB total, growing ~7.8 MB/day, and the only way to reset it was recreating
    # the container. It also made the boot probe's `docker logs --since` cost 2.7s
    # while the status endpoint is polled every few seconds -- slowest exactly during
    # a boot, which is when it is watched.
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    tty: true
    stdin_open: true

  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DOCKER_HOST: unix:///var/run/docker.sock
      MC_SERVER_DIR: "/minecraft"
      SDTD_SERVER_DIR: "/sevendtd"
      SDTD_CONFIG_DIR: "/sevendtd-config"
      RCON_HOST: "minecraft"
      RCON_PORT: "25575"
      SDTD_TELNET_HOST: "sevendtd"
      SDTD_TELNET_PORT: "8081"
      SDTD_TELNET_PASSWORD: "${SDTD_TELNET_PASSWORD:-yoshlingcontrol}"
      PZ_SERVER_DIR: "/zomboid"
      PZ_WORKSHOP_DIR: "/zomboid-workshop"
      PZ_SERVER_NAME: "yoshling"
      # RCON isn't published to the host; reached over the compose network.
      PZ_RCON_HOST: "zomboid"
      PZ_RCON_PORT: "27015"
      PZ_RCON_PASSWORD: "${PZ_RCON_PASSWORD:-yoshlingcontrol}"
      # Watch Steam for Workshop mod updates. A republished mod locks out anyone
      # who logs off, so this checks every 5 min, announces in game while people
      # are playing, and applies the update only once the server is empty.
      # Set to "false" to turn the watcher off entirely.
      PZ_UPDATE_WATCH: "true"
      PZ_UPDATE_POLL_MS: "300000"
      # Once an update is pending there is nothing left to discover, so the
      # watcher switches to this faster cadence purely to notice the server
      # emptying. Without it players had to log off and then wait out the full
      # 5-minute poll before the restart even started.
      PZ_UPDATE_PENDING_POLL_MS: "15000"
      # Large world uploads bypass Cloudflare's 100MB cap via this direct host.
      NEXT_PUBLIC_DIRECT_UPLOAD_HOST: "${DIRECT_UPLOAD_HOST:-}"
      NEXT_PUBLIC_DIRECT_UPLOAD_ORIGIN: "${DIRECT_UPLOAD_HOST:-}"
    volumes:
      - mc-data:/minecraft
      - sdtd-saves:/sevendtd
      - sdtd-server:/sevendtd-config
      - pz-data:/zomboid
      # Read-only: the mods page only reads mod ids off disk from here.
      - pz-workshop:/zomboid-workshop:ro
      # The deploy dir itself, at the same path inside and out, so the app can
      # read and patch THIS file and run `docker compose` against it. Changing a
      # container's memory/version means recreating it, and compose is the only
      # way to do that without losing its labels, aliases and mounts.
      - ./:/opt/yoshling
      - web-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - minecraft
    # Run tini as PID 1 so orphaned children get reaped.
    #
    # Without it `next-server` is PID 1, and PID 1 in a container inherits orphans
    # but only reaps them if it calls wait(). Next does not, so every `timeout 3
    # docker stats` the two stats routes fire left a zombie behind: 2,134 of them had
    # accumulated in the container by 2026-09-28, on a path polled every few seconds
    # by every open tab. The endpoint is the busiest in the app, so this ends in PID
    # exhaustion rather than plateauing.
    init: true
    # Deliberately `unless-stopped`, unlike all three games: the dashboard is how a
    # world gets powered back on, so it has to come back after a host reboot even
    # though nothing else does.
    restart: unless-stopped
    # The only container that had NO limit (verified: `docker inspect yoshling-web-1
    # --format '{{.HostConfig.Memory}}'` -> 0, while the three games all had one). That
    # made it the one process on the box able to take the whole host down, and it is
    # also the one that buffers uploads and forks `docker`/`tar`.
    #
    # Sized against the 2 GB world-upload cap, and the arithmetic is DOUBLE the cap
    # because `/api/7dtd/world` holds the payload twice: `await request.formData()` keeps
    # the 2 GB Blob alive while `Buffer.from(await file.arrayBuffer())` allocates a second
    # copy (the Buffer itself is a view, so there is no third). Measured on a 50 MB file:
    # `arrayBuffer()` raised `process.memoryUsage().arrayBuffers` by 104.9 MB, i.e. 2x.
    # Add the measured 954 MB `memory.peak` baseline (steady state is only 195 MB) and a
    # 2 GB upload needs ~5 GB, so 6g.
    #
    # The first version of this limit was 3g with a comment claiming it was "headroom for
    # one upload". It was not -- it would have OOM-killed the dashboard mid-upload, and
    # before the limit existed that upload merely swapped and completed. Sizing a ceiling
    # from the payload rather than from the peak is the mistake; measure, do not reason.
    #
    # **Do not lower this without streaming that upload first**; once it streams, ~1g.
    # Ceilings may over-commit (PZ's 14g + this 6g exceeds the 16 GB box) because they are
    # limits, not reservations, and only one world runs at a time.
    #
    # An unbounded web container is still worse than an over-committed ceiling: with a
    # limit the kernel kills the dashboard, which restarts and loses nothing, instead of
    # letting it push a live world into OOM.
    mem_limit: 6g
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }

volumes:
  mc-data:
  web-data:
  sdtd-server:
  sdtd-saves:
  sdtd-backup:
  sdtd-log:
  pz-data:
  pz-workshop:
